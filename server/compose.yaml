name: tradepilot

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  LOG_LEVEL: info
  OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:?set OIDC_JWKS_URL}
  OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
  TRADEPILOT_IMPLEMENTATION_REVISION: ${TRADEPILOT_IMPLEMENTATION_REVISION:?set a 40-character Git SHA}
  TRADEPILOT_PYTHON_EXECUTABLE: /usr/local/bin/python
  TRADEPILOT_PYTHON_WORKING_DIRECTORY: /app/research
  TRADEPILOT_CONTRACT_SCHEMA_DIRECTORY: /app/research/contracts
  TRADEPILOT_DATA_ROOT: /artifacts/data
  TRADEPILOT_REPORT_ROOT: /artifacts/reports
  TRADEPILOT_VERIFIER_TIMEOUT_MS: ${TRADEPILOT_VERIFIER_TIMEOUT_MS:-30000}
  TRADEPILOT_VERIFIER_MAX_CONCURRENCY: ${TRADEPILOT_VERIFIER_MAX_CONCURRENCY:-2}
  TRADEPILOT_VERIFIER_MAX_PENDING_REQUESTS: ${TRADEPILOT_VERIFIER_MAX_PENDING_REQUESTS:-16}

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  restart: unless-stopped
  stop_grace_period: 30s
  networks: ["backend"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: tradepilot
    secrets:
      - postgres_admin_password
      - postgres_migrator_password
      - postgres_api_password
      - postgres_worker_password
    volumes:
      - tradepilot-postgres:/var/lib/postgresql/data
      - ./docker/postgres/001-create-roles.sh:/docker-entrypoint-initdb.d/001-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradepilot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    networks: ["backend"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  migrations:
    build:
      context: ..
      dockerfile: server/Dockerfile.api
      args:
        IMPLEMENTATION_REVISION: ${TRADEPILOT_IMPLEMENTATION_REVISION:?set a 40-character Git SHA}
    image: tradepilot-api:${TRADEPILOT_IMPLEMENTATION_REVISION}
    entrypoint: ["tradepilot-entrypoint"]
    command: ["migrator", "node", "dist/src/database/migrate-cli.js", "up"]
    environment: *runtime-environment
    secrets: ["postgres_migrator_password"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["backend"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile.api
      args:
        IMPLEMENTATION_REVISION: ${TRADEPILOT_IMPLEMENTATION_REVISION:?set a 40-character Git SHA}
    image: tradepilot-api:${TRADEPILOT_IMPLEMENTATION_REVISION}
    <<: *runtime-hardening
    networks: ["backend", "identity-egress"]
    environment:
      <<: *runtime-environment
      PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    secrets: ["postgres_api_password"]
    volumes:
      - ${TRADEPILOT_DATA_HOST_PATH:?set approved dataset directory}:/artifacts/data:ro
      - ${TRADEPILOT_REPORT_HOST_PATH:?set approved report directory}:/artifacts/reports:ro
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      migrations:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile.worker
      target: runtime
      args:
        IMPLEMENTATION_REVISION: ${TRADEPILOT_IMPLEMENTATION_REVISION:?set a 40-character Git SHA}
    image: tradepilot-worker:${TRADEPILOT_IMPLEMENTATION_REVISION}
    <<: *runtime-hardening
    environment: *runtime-environment
    secrets: ["postgres_worker_password"]
    volumes:
      - ${TRADEPILOT_DATA_HOST_PATH:?set approved dataset directory}:/artifacts/data:ro
      - ${TRADEPILOT_REPORT_HOST_PATH:?set approved report directory}:/artifacts/reports:rw
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      migrations:
        condition: service_completed_successfully

networks:
  backend:
    internal: true
  identity-egress:

volumes:
  tradepilot-postgres:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:-./secrets/postgres_admin_password.txt}
  postgres_migrator_password:
    file: ${POSTGRES_MIGRATOR_PASSWORD_FILE:-./secrets/postgres_migrator_password.txt}
  postgres_api_password:
    file: ${POSTGRES_API_PASSWORD_FILE:-./secrets/postgres_api_password.txt}
  postgres_worker_password:
    file: ${POSTGRES_WORKER_PASSWORD_FILE:-./secrets/postgres_worker_password.txt}
