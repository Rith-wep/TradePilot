services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot
      POSTGRES_DB: tradepilot
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot -d tradepilot"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - tradepilot-postgres:/var/lib/postgresql/data

volumes:
  tradepilot-postgres:
